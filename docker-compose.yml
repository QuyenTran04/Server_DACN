version: "3.9"

services:
  server:
    build:
      context: .               # build từ gốc dự án (đúng cấu trúc bạn)
      dockerfile: Dockerfile
    env_file: ./.env
    ports: ["5000:5000"]
    depends_on: [n8n]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.79.3
    platform: linux/amd64
    ports: ["5678:5678"]
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      # Dùng User Management (đăng nhập bằng email)
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
